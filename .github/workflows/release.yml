# Release — triggered by pushing a tag matching v*, or called by the
# `release` job of bastionhub-ci.yml with the tag as the `tag` input
# after that job's `tag` job has pushed the tag. A tag pushed with
# GITHUB_TOKEN starts no workflow, so the push trigger does not fire
# for it. TAG is the `tag` input, else github.ref_name (the pushed tag).
#
# Builds the 6-platform release matrix, packages each as a
# .tar.gz (Unix) or .zip (Windows), generates a sha256 checksums
# manifest, and attaches everything to a GitHub Release with
# auto-generated release notes. A final job sends a
# repository_dispatch event (formula-update, with the tool and the
# tag) to roselabs-io/homebrew-tools, whose workflow updates
# Formula/bastionhub.rb. Prerelease tags (containing '-') send none.
# The event is sent with HOMEBREW_TAP_TOKEN, a secret of the
# Bitwarden project roselabs-ci (id: the organization variable
# BWS_SHARED_PROJECT_ID), under `bws run` with the secret
# BWS_ACCESS_TOKEN.
#
# Version is injected via -ldflags so `bastionhub --version` reports
# the actual git tag rather than the source-default "0.1.0-dev".

name: Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: Existing tag to release (vX.Y.Z)
        required: true
        type: string
    secrets:
      BWS_ACCESS_TOKEN:
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write  # required to create the GitHub Release

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build \
            -ldflags "-s -w -X main.version=${TAG}" \
            -trimpath \
            -o dist/bastionhub${{ matrix.ext }} .

      - name: Package
        run: |
          cd dist
          archive_base="bastionhub-${TAG}-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "../${archive_base}.zip" bastionhub.exe
          else
            tar -czf "../${archive_base}.tar.gz" bastionhub
          fi
          cd ..
          ls -la "${archive_base}".*

      - uses: actions/upload-artifact@v4
        with:
          name: bastionhub-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bastionhub-*-${{ matrix.goos }}-${{ matrix.goarch }}.*
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Generate checksums
        run: |
          cd dist
          sha256sum bastionhub-*-*.{tar.gz,zip} 2>/dev/null > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            dist/bastionhub-*-*.tar.gz
            dist/bastionhub-*-*.zip
            dist/checksums.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(env.TAG, '-') }}

  homebrew:
    name: Notify homebrew-tools
    needs: release
    # The env context is not available in a job-level `if`.
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      # `bws` 2.1.0 from the releases of bitwarden/sdk-sm, checked against
      # its SHA-256 and run from $RUNNER_TEMP.
      - name: Install bws
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bws.zip" https://github.com/bitwarden/sdk-sm/releases/download/bws-v2.1.0/bws-x86_64-unknown-linux-gnu-2.1.0.zip
          echo "ba8233c3a4aee5d43e3c73bbd04d99e9bc5aba13bbbfd06d89b073abe732b860  $RUNNER_TEMP/bws.zip" | sha256sum --check --quiet
          python3 -m zipfile -e "$RUNNER_TEMP/bws.zip" "$RUNNER_TEMP/bws"
          chmod +x "$RUNNER_TEMP/bws/bws"
          echo "$RUNNER_TEMP/bws" >> "$GITHUB_PATH"

      # GITHUB_TOKEN cannot write to another repository; HOMEBREW_TAP_TOKEN
      # needs Contents write on roselabs-io/homebrew-tools.
      - name: Send formula-update event
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
          BWS_PROJECT_ID: ${{ vars.BWS_SHARED_PROJECT_ID }}
        run: |
          # The variables expand in the shell `bws run` starts, where the
          # secret is set.
          # shellcheck disable=SC2016
          bws run --project-id "$BWS_PROJECT_ID" -- '
            test -n "$HOMEBREW_TAP_TOKEN" || { echo "::error::HOMEBREW_TAP_TOKEN is not in the Bitwarden project $BWS_PROJECT_ID"; exit 1; }
            GH_TOKEN="$HOMEBREW_TAP_TOKEN" gh api repos/roselabs-io/homebrew-tools/dispatches \
              -f event_type=formula-update \
              -f "client_payload[tool]=bastionhub" \
              -f "client_payload[tag]=$TAG"
          '

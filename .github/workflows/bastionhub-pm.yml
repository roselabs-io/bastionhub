name: bastionhub PM sync

# Runs `governor-ticket-sync` of the Governor package with `tickets.*` of pipeline.yaml: every issue
# with a `bastionhub-pm` block is added to the organization project `Governor` (number 2, `tickets.project` of pipeline.yaml), with its fields set from the
# block. A PR's `Bastionhub-Issue: #N` line moves issue N to In progress (draft) or Review (ready), and a
# merge into `main` closes it as Done.
#
# `GOVERNOR_PM_TOKEN` is a secret of the Bitwarden project `roselabs-ci`, whose id is the organization variable
# `BWS_SHARED_PROJECT_ID`, holding a token that can read and write the organization's projects and the repository's
# issues, and read the Governor package repository. `bws` reads it with the secret `BWS_ACCESS_TOKEN`: one step writes
# it, masked, to `$GITHUB_ENV` for the checkout of the Governor package, and the sync runs under `bws run`.
# `github.token` cannot write an organization project.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bastionhub-pm.yml'
      - 'pipeline.yaml'
  issues:
    types: [opened, edited, closed, reopened, milestoned, demilestoned]
  pull_request:
    types: [opened, reopened, converted_to_draft, ready_for_review, closed]
  workflow_dispatch:

concurrency:
  group: bastionhub-pm-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      BWS_PROJECT_ID: ${{ vars.BWS_SHARED_PROJECT_ID }}
      BASTIONHUB_PM_ISSUE_NUMBER: ${{ github.event.issue.number }}
      PIPELINE_CONFIG: ${{ github.workspace }}/pipeline.yaml
    steps:
      - uses: actions/checkout@v7

      # `bws` 2.1.0 from the releases of bitwarden/sdk-sm, checked against its SHA-256 and run from $RUNNER_TEMP.
      - name: Install bws
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bws.zip" https://github.com/bitwarden/sdk-sm/releases/download/bws-v2.1.0/bws-x86_64-unknown-linux-gnu-2.1.0.zip
          echo "ba8233c3a4aee5d43e3c73bbd04d99e9bc5aba13bbbfd06d89b073abe732b860  $RUNNER_TEMP/bws.zip" | sha256sum --check --quiet
          python3 -m zipfile -e "$RUNNER_TEMP/bws.zip" "$RUNNER_TEMP/bws"
          chmod +x "$RUNNER_TEMP/bws/bws"
          echo "$RUNNER_TEMP/bws" >> "$GITHUB_PATH"

      - name: Read GOVERNOR_PM_TOKEN
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: |
          # The variable expands in the shell `bws run` starts, where the secret is set.
          # shellcheck disable=SC2016
          bws run --project-id "$BWS_PROJECT_ID" -- '
            test -n "$GOVERNOR_PM_TOKEN" || { echo "::error::GOVERNOR_PM_TOKEN is not in the Bitwarden project $BWS_PROJECT_ID"; exit 1; }
            echo "::add-mask::$GOVERNOR_PM_TOKEN"
            echo "GOVERNOR_PM_TOKEN=$GOVERNOR_PM_TOKEN" >> "$GITHUB_ENV"
          '

      - name: Check out the Governor package
        uses: actions/checkout@v7
        with:
          repository: roselabs-io/governor
          token: ${{ env.GOVERNOR_PM_TOKEN }}
          path: .governor-package

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-glob: .governor-package/uv.lock

      - name: Synchronize GitHub project management metadata
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          bws run --project-id "$BWS_PROJECT_ID" -- uv run --frozen --no-dev --project .governor-package governor-ticket-sync 2>&1 | tee "$RUNNER_TEMP/bastionhub-pm.log"

      - name: Report PM sync failure
        if: failure() && (github.event.issue.number || github.event.pull_request.number)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "bastionhub PM sync failed."
            echo
            echo "Run: $RUN_URL"
            echo
            echo '~~~text'
            tail -c 5000 "$RUNNER_TEMP/bastionhub-pm.log" 2>/dev/null || echo "No sync log was produced."
            echo '~~~'
          } > "$RUNNER_TEMP/bastionhub-pm-comment.md"
          gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/bastionhub-pm-comment.md"

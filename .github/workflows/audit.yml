# `just audit` (govulncheck against the Go vulnerability database) on a pull request or a push to `main` that
# changes `go.mod` or `go.sum`, and weekly on `main`. It needs the network, so it is a job of its own and not
# part of `just gate`. A finding fails the job and is triaged like a review finding (AGENTS.md, Finding triage).

name: audit

on:
  pull_request:
    paths: [go.mod, go.sum]
  push:
    branches: [main]
    paths: [go.mod, go.sum]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Audit
        run: just audit

# /etc/ssh/sshd_config.d/30-passthrough-acl.conf
#
# AuthorizedPrincipalsCommand pattern (Pattern B).
# Lets the gw-passthrough Unix user accept multiple principals dynamically,
# each with its own permitopen / restrictions, rather than baking
# per-destination scoping into a single Match User block.
#
# Deploy:
#   1. Create Unix user (no shell):
#        sudo useradd -m -s /usr/sbin/nologin gw-passthrough
#   2. Ship the script + this drop-in (perms enforced by sshd):
#        scp deploy/bastion/principal-to-acl.sh bastion-root:/usr/local/bin/principal-to-acl
#        ssh bastion-root 'chown root:root /usr/local/bin/principal-to-acl && chmod 755 /usr/local/bin/principal-to-acl'
#        scp deploy/bastion/30-passthrough-acl.conf bastion-root:/etc/ssh/sshd_config.d/30-passthrough-acl.conf
#   3. Validate + reload:
#        ssh bastion-root 'sshd -t && systemctl reload ssh'
#
# How it works:
#   - When a cert presents principal X to user gw-passthrough, sshd runs
#     /usr/local/bin/principal-to-acl with %u=gw-passthrough %i=<key_id>
#   - The script emits a list of "<options> <principal>" lines
#   - sshd accepts the cert iff X is in that list, and applies the options
#   - This lets per-principal scoping live in a script rather than per-key
#     authorized_keys lines.

Match User gw-passthrough
    AuthorizedPrincipalsCommand /usr/local/bin/principal-to-acl %u %i
    AuthorizedPrincipalsCommandUser gw-passthrough
    AllowTcpForwarding local
    ForceCommand /bin/false
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no

# /etc/ssh/sshd_config.d/10-bastionhub.conf
#
# bastionhub foundational sshd config: CA trust + role-based Match User blocks.
# Ship alongside 30-passthrough-acl.conf for the optional
# (per-principal scoping for the gw-passthrough role).
#
# Deploy (first-time bastion setup):
#   # 0. On the engineer laptop — generate CAs if not already
#   sshca ca init --dir ./ca
#
#   # 1. Ship the user CA pubkey to the bastion (trust root)
#   scp ca/user_ca.pub bastion-root:/etc/ssh/user_ca.pub
#
#   # 2. (Optional) Ship the host CA pubkey if you'll sign host certs
#   scp ca/host_ca.pub bastion-root:/etc/ssh/host_ca.pub
#
#   # 3. Create the role Unix users (no shell)
#   ssh bastion-root 'useradd -m -s /usr/sbin/nologin gw-tunnel || true'
#   ssh bastion-root 'useradd -m -s /usr/sbin/nologin gw-user || true'
#   # (gw-passthrough only if using 30-passthrough-acl.conf — see that file)
#
#   # 4. Ship this drop-in
#   scp deploy/bastion/10-bastionhub.conf bastion-root:/etc/ssh/sshd_config.d/10-bastionhub.conf
#
#   # 5. Validate + reload
#   ssh bastion-root 'sshd -t && systemctl reload ssh && echo reloaded'
#
# After this is live:
#   - gw-tunnel role: endpoint devices dial in via `bastionhub endpoint setup`
#     (autossh + cert with principal "gw-tunnel" + bastion-side listen port).
#   - gw-user role: engineers SSH via `bastionhub ssh <endpoint>` (ProxyJump
#     through bastion using a cert with principal "gw-user").

# -----------------------------------------------------------------------------
# Globals. These are host-wide, not role-scoped: the Match blocks below set
# PasswordAuthentication too, but only for those three users. Without it here,
# every other account on the box keeps the distro default — which on several
# distros is "yes".
# -----------------------------------------------------------------------------
PasswordAuthentication no
KbdInteractiveAuthentication no

# Drop dead connections rather than leaving tunnel listeners bound to sockets
# nothing is on the other end of. Without this a flapping endpoint can hold its
# port until sshd notices, and the next reconnect fails to bind.
ClientAliveInterval 30
ClientAliveCountMax 3

# -----------------------------------------------------------------------------
# CA trust — all user certs presented to this sshd must be signed by this CA.
# -----------------------------------------------------------------------------
TrustedUserCAKeys /etc/ssh/user_ca.pub

# Revocation list — sshd re-reads on every connection (no daemon reload
# needed). `sshca cert revoke --ship <bastion>:/etc/ssh/revoked_keys.krl`
# pushes updates here.
RevokedKeys /etc/ssh/revoked_keys.krl

# Host certificate (optional) — if present, clients with `@cert-authority`
# in their known_hosts can validate the bastion's identity without TOFU.
# Sign one via:
#   sshca cert sign --ca host --principal bastion,<bastion-hostname> \
#       --valid +52w --key-id "bastion-host-$(date -u +%Y%m%dT%H%MZ)" \
#       /etc/ssh/ssh_host_ed25519_key.pub
# Then scp the resulting -cert.pub to the bastion and uncomment:
# HostCertificate /etc/ssh/ssh_host_ed25519_key-cert.pub

# -----------------------------------------------------------------------------
# Role: gw-tunnel
# -----------------------------------------------------------------------------
# Reverse-tunnel endpoint dial-in. The cert principal "gw-tunnel" matches
# the Unix username by OpenSSH's default principal check (the only Match
# directive that works for cert auth — see ADR-001 in the gateway repo for
# the Match-Principal-isn't-valid-syntax constraint).
#
# Allows incoming sessions that establish a reverse tunnel (-R) on the
# bastion-side port range. Refuses shell + PTY + agent/X11 forwarding +
# local -L forwarding.
Match User gw-tunnel
    AuthenticationMethods publickey
    PasswordAuthentication no
    AllowTcpForwarding remote
    # PermitListen accepts no port ranges either (12001-12099 is a syntax
    # error, not a range), so the ports are enumerated. Widen both this and
    # gw-user's PermitOpen together if the range ever changes.
    PermitListen 12001 12002 12003 12004 12005 12006 12007 12008 12009 12010 12011 12012 12013 12014 12015 12016 12017 12018 12019 12020 12021 12022 12023 12024 12025 12026 12027 12028 12029 12030 12031 12032 12033 12034 12035 12036 12037 12038 12039 12040 12041 12042 12043 12044 12045 12046 12047 12048 12049 12050 12051 12052 12053 12054 12055 12056 12057 12058 12059 12060 12061 12062 12063 12064 12065 12066 12067 12068 12069 12070 12071 12072 12073 12074 12075 12076 12077 12078 12079 12080 12081 12082 12083 12084 12085 12086 12087 12088 12089 12090 12091 12092 12093 12094 12095 12096 12097 12098 12099
    PermitOpen none
    ForceCommand /bin/false
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no

# -----------------------------------------------------------------------------
# Role: gw-user
# -----------------------------------------------------------------------------
# Engineer bastion-jump role. Cert principal "gw-user" matches the Unix user.
#
# Allows local TCP forwarding (-W / -L) so ProxyJump (`bastionhub ssh ...`)
# can reach the endpoint's reverse-tunnel listener. No shell, no reverse
# tunnel, no agent/X11 forwarding.
Match User gw-user
    AuthenticationMethods publickey
    PasswordAuthentication no
    AllowTcpForwarding local
    PermitListen none
    ForceCommand /bin/false
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    # Scope the forwarding to tunnel ports. Without this, "AllowTcpForwarding
    # local" lets a gw-user cert reach ANY address this host can — its own
    # sshd, a database on the box, anything on its network — which is a much
    # broader grant than "you may reach the fleet".
    #
    # PermitOpen accepts no port ranges and matches the requested host string
    # literally, so 12001-12099 is enumerated in both spellings a client might
    # use. If you widen the port range above, widen this too.
    PermitOpen 127.0.0.1:12001 localhost:12001 127.0.0.1:12002 localhost:12002 127.0.0.1:12003 localhost:12003 127.0.0.1:12004 localhost:12004 127.0.0.1:12005 localhost:12005 127.0.0.1:12006 localhost:12006 127.0.0.1:12007 localhost:12007 127.0.0.1:12008 localhost:12008 127.0.0.1:12009 localhost:12009 127.0.0.1:12010 localhost:12010 127.0.0.1:12011 localhost:12011 127.0.0.1:12012 localhost:12012 127.0.0.1:12013 localhost:12013 127.0.0.1:12014 localhost:12014 127.0.0.1:12015 localhost:12015 127.0.0.1:12016 localhost:12016 127.0.0.1:12017 localhost:12017 127.0.0.1:12018 localhost:12018 127.0.0.1:12019 localhost:12019 127.0.0.1:12020 localhost:12020 127.0.0.1:12021 localhost:12021 127.0.0.1:12022 localhost:12022 127.0.0.1:12023 localhost:12023 127.0.0.1:12024 localhost:12024 127.0.0.1:12025 localhost:12025 127.0.0.1:12026 localhost:12026 127.0.0.1:12027 localhost:12027 127.0.0.1:12028 localhost:12028 127.0.0.1:12029 localhost:12029 127.0.0.1:12030 localhost:12030 127.0.0.1:12031 localhost:12031 127.0.0.1:12032 localhost:12032 127.0.0.1:12033 localhost:12033 127.0.0.1:12034 localhost:12034 127.0.0.1:12035 localhost:12035 127.0.0.1:12036 localhost:12036 127.0.0.1:12037 localhost:12037 127.0.0.1:12038 localhost:12038 127.0.0.1:12039 localhost:12039 127.0.0.1:12040 localhost:12040 127.0.0.1:12041 localhost:12041 127.0.0.1:12042 localhost:12042 127.0.0.1:12043 localhost:12043 127.0.0.1:12044 localhost:12044 127.0.0.1:12045 localhost:12045 127.0.0.1:12046 localhost:12046 127.0.0.1:12047 localhost:12047 127.0.0.1:12048 localhost:12048 127.0.0.1:12049 localhost:12049 127.0.0.1:12050 localhost:12050 127.0.0.1:12051 localhost:12051 127.0.0.1:12052 localhost:12052 127.0.0.1:12053 localhost:12053 127.0.0.1:12054 localhost:12054 127.0.0.1:12055 localhost:12055 127.0.0.1:12056 localhost:12056 127.0.0.1:12057 localhost:12057 127.0.0.1:12058 localhost:12058 127.0.0.1:12059 localhost:12059 127.0.0.1:12060 localhost:12060 127.0.0.1:12061 localhost:12061 127.0.0.1:12062 localhost:12062 1
# /etc/ssh/sshd_config.d/10-bastionhub.conf
#
# bastionhub foundational sshd config: CA trust + role-based Match User blocks.
# Ship alongside 30-passthrough-acl.conf for the optional Pattern B
# (per-principal scoping for the gw-passthrough role).
#
# Deploy (first-time bastion setup):
#   # 0. On the engineer laptop — generate CAs if not already
#   sshca ca init --dir ./ca
#
#   # 1. Ship the user CA pubkey to the bastion (trust root)
#   scp ca/user_ca.pub bastion-root:/etc/ssh/user_ca.pub
#
#   # 2. (Optional) Ship the host CA pubkey if you'll sign host certs
#   scp ca/host_ca.pub bastion-root:/etc/ssh/host_ca.pub
#
#   # 3. Create the role Unix users (no shell)
#   ssh bastion-root 'useradd -m -s /usr/sbin/nologin gw-tunnel || true'
#   ssh bastion-root 'useradd -m -s /usr/sbin/nologin gw-user || true'
#   # (gw-passthrough only if using 30-passthrough-acl.conf — see that file)
#
#   # 4. Ship this drop-in
#   scp deploy/bastion/10-bastionhub.conf bastion-root:/etc/ssh/sshd_config.d/10-bastionhub.conf
#
#   # 5. Validate + reload
#   ssh bastion-root 'sshd -t && systemctl reload ssh && echo reloaded'
#
# After this is live:
#   - gw-tunnel role: endpoint devices dial in via `bastionhub endpoint setup`
#     (autossh + cert with principal "gw-tunnel" + bastion-side listen port).
#   - gw-user role: engineers SSH via `bastionhub ssh <endpoint>` (ProxyJump
#     through bastion using a cert with principal "gw-user").

# -----------------------------------------------------------------------------
# CA trust — all user certs presented to this sshd must be signed by this CA.
# -----------------------------------------------------------------------------
TrustedUserCAKeys /etc/ssh/user_ca.pub

# Revocation list — sshd re-reads on every connection (no daemon reload
# needed). `sshca cert revoke --ship <bastion>:/etc/ssh/revoked_keys.krl`
# pushes updates here.
RevokedKeys /etc/ssh/revoked_keys.krl

# Host certificate (optional) — if present, clients with `@cert-authority`
# in their known_hosts can validate the bastion's identity without TOFU.
# Sign one via:
#   sshca cert sign --ca host --principal bastion,<bastion-hostname> \
#       --valid +52w --key-id "bastion-host-$(date -u +%Y%m%dT%H%MZ)" \
#       /etc/ssh/ssh_host_ed25519_key.pub
# Then scp the resulting -cert.pub to the bastion and uncomment:
# HostCertificate /etc/ssh/ssh_host_ed25519_key-cert.pub

# -----------------------------------------------------------------------------
# Role: gw-tunnel
# -----------------------------------------------------------------------------
# Reverse-tunnel endpoint dial-in. The cert principal "gw-tunnel" matches
# the Unix username by OpenSSH's default principal check (the only Match
# directive that works for cert auth — see ADR-001 in the gateway repo for
# the Match-Principal-isn't-valid-syntax constraint).
#
# Allows incoming sessions that establish a reverse tunnel (-R) on the
# bastion-side port range. Refuses shell + PTY + agent/X11 forwarding +
# local -L forwarding.
Match User gw-tunnel
    AuthenticationMethods publickey
    PasswordAuthentication no
    AllowTcpForwarding remote
    PermitListen 12001-12099
    PermitOpen none
    ForceCommand /bin/false
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no

# -----------------------------------------------------------------------------
# Role: gw-user
# -----------------------------------------------------------------------------
# Engineer bastion-jump role. Cert principal "gw-user" matches the Unix user.
#
# Allows local TCP forwarding (-W / -L) so ProxyJump (`bastionhub ssh ...`)
# can reach the endpoint's reverse-tunnel listener. No shell, no reverse
# tunnel, no agent/X11 forwarding.
Match User gw-user
    AuthenticationMethods publickey
    PasswordAuthentication no
    AllowTcpForwarding local
    PermitListen none
    ForceCommand /bin/false
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
